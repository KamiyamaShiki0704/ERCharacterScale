# rc.3: enemy rules include supported local allies/summons.
# Add hostile_only=true to restrict a rule to hostile units.
# ERCharacterScale — UTF-8 TOML. Edit before starting the game.
# Scale is relative to each unit's original size; use a finite number greater than zero.
# First complete matching rule wins. Rules never multiply each other.
version = 1
enabled = true

[player]
enabled = true

[enemies]
enabled = true

