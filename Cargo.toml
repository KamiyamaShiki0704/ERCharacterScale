[package]
name = "player-scale-no-bone"
version = "2.55.5"
edition = "2024"
publish = false
license = "MIT"
description = "Configurable player and enemy scaling with coherent cloth and collision for Elden Ring"
repository = "https://github.com/KamiyamaShiki0704/ERCharacterScale"

[features]
default = []
diagnostics = []

[dependencies]
shikifsrs-elden-ring = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "930f818431e72209b49d2e37265a1f8150fa5390" }
shikifsrs-runtime = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "930f818431e72209b49d2e37265a1f8150fa5390" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
glam = "=0.33.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"
ilhook = { version = "2.3.0", features = ["x64"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lib]
name = "ERCharacterScale"
crate-type = ["cdylib"]

[workspace]
